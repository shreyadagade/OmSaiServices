<div class="header py-4">
  <div class="container">
    <div class="d-flex">

      <a class="header-brand text-danger" href="/">
        <img
          src="/images/logo.png"
          class="header-brand-img"
          style="height: 3rem;"
          alt="Om Sai Services"
        />
        Om Sai Services
      </a>

      <div class="d-flex order-lg-2 ml-auto">
        <nav class="d-flex">
          <a href="/account/login" class="nav-link pr-0 leading-none">
            <span class="ml-2 d-none d-lg-block">
              <span class="text-default">
                <i class="fe fe-user"></i> Admin Login
              </span>
            </span>
          </a>
        </nav>
      </div>

      <a
        href="#"
        class="header-toggler d-lg-none ml-3 ml-lg-0 text-info"
        (click)="$event.preventDefault(); toggleMenu()"
      >
        <span class="header-toggler-icon"></span>
      </a>

    </div>
  </div>
</div>

<div
  class="header collapse d-lg-none p-0"
  [class.show]="isMenuOpen"
>
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg order-lg-first">
        <ul class="nav nav-tabs border-0 flex-column flex-lg-row">
          <li class="nav-item">
            <a href="/account/login" class="nav-link pr-0 leading-none">
              <span class="text-default">
                <i class="fe fe-user"></i> Admin Login
              </span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
