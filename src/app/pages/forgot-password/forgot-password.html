
<div class="forgot-page">

  <!-- HEADER -->
  <header class="forgot-header">

    <a routerLink="/" class="brand">
      <img src="/images/logo.png" alt="Om Sai Services Logo">
      <span>Om Sai Services</span>
    </a>

    <a routerLink="/" class="home-link">
      ⌂ Home
    </a>

  </header>

  <!-- MAIN CONTENT -->
  <main class="forgot-main">

    <section class="forgot-card">

      <!-- ICON -->
      <div class="forgot-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="10" width="18" height="11" rx="2"/>
          <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
          <path d="M12 14v3"/>
        </svg>
      </div>

      <!-- HEADING -->
      <h2>Forgot Password?</h2>

      <!-- FORM -->
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">

        <div class="form-group">

          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            #emailField="ngModel"
            placeholder="Enter your email address"
            autocomplete="email"
            required
            email>

          @if (emailField.invalid && emailField.touched) {
            <small class="validation-error">
              Please enter a valid email address.
            </small>
          }

        </div>

        <!-- MESSAGE -->
        @if (message) {
          <div class="info-message" role="status">
            {{ message }}
          </div>
        }

        <!-- SUBMIT -->
        <button type="submit" class="reset-button">
          Submit
        </button>

      </form>

      <!-- BACK TO LOGIN -->
      <a routerLink="/account/login" class="back-link">
        <span>←</span> Back to Login
      </a>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="forgot-footer">
    Copyright © 2026 Om Sai Services. All rights reserved.
  </footer>

</div>
