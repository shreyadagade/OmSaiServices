
<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h3 class="page-title">
          {{ isEdit ? 'Edit Project' : 'Create Project' }}
        </h3>
      </div>

      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item">
            <a routerLink="/admin/project">Project</a>
          </li>
          <li class="breadcrumb-item active">
            {{ isEdit ? 'Edit' : 'Create' }}
          </li>
        </ol>
      </div>
    </div>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-8">

        <form class="card" (ngSubmit)="saveProject()">
          <input type="hidden" name="projectId" [(ngModel)]="projectId">

          <div class="card-body">
            <div class="row">

              <div class="col-md-5 mb-3">
                <div class="form-group">
                  <label for="projectName" class="form-label">
                    Project Name
                  </label>

                  <input
                    type="text"
                    id="projectName"
                    name="projectName"
                    class="form-control"
                    placeholder="Project Name"
                    [(ngModel)]="projectName"
                    required>
                </div>
              </div>

              <div class="col-sm-6 col-md-3">
                <div class="form-group">
                  <label for="totalManPower" class="form-label">
                    Total Man-Power
                  </label>

                  <input
                    type="number"
                    id="totalManPower"
                    name="totalManPower"
                    class="form-control"
                    placeholder="Total Man Power"
                    [(ngModel)]="totalManPower"
                    required>
                </div>
              </div>

              <div class="col-sm-6 col-md-4">
                <div class="form-group">
                  <label for="projectBudget" class="form-label">
                    Project Budget
                  </label>

                  <input
                    type="number"
                    id="projectBudget"
                    name="projectBudget"
                    class="form-control"
                    placeholder="Project Budget"
                    [(ngModel)]="projectBudget"
                    required>
                </div>
              </div>

              <div class="col-md-12 mb-3">
                <div class="form-group mb-0">
                  <label for="projectDiscription" class="form-label">
                    Project Description
                  </label>

                  <textarea
                    rows="2"
                    id="projectDiscription"
                    name="projectDiscription"
                    class="form-control"
                    placeholder="Here can be your description"
                    [(ngModel)]="projectDiscription">
                  </textarea>
                </div>
              </div>

              <div class="col-sm-6 col-md-6">
                <div class="form-group">
                  <div class="form-label">Project Status</div>

                  <div class="custom-controls-stacked">
                    <label
                      class="custom-control custom-radio"
                      *ngFor="let item of statusList">

                      <input
                        type="radio"
                        class="custom-control-input"
                        name="status"
                        [value]="item"
                        [(ngModel)]="status">

                      <div class="custom-control-label">
                        {{ item === 'Upcomping' ? 'Upcoming' : item }}
                      </div>
                    </label>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-md-6">
                <div class="form-group">
                  <label for="projectStartDate" class="form-label">
                    Project Start Date
                  </label>

                  <input
                    type="date"
                    id="projectStartDate"
                    name="projectStartDate"
                    class="form-control"
                    placeholder="Project Start Date"
                    [(ngModel)]="projectStartDate"
                    required>
                </div>
              </div>

            </div>

            <div class="text-danger mt-2" *ngIf="errorMessage">
              {{ errorMessage }}
            </div>
          </div>

          <div class="card-footer text-right">
            <div class="card-footer text-center">
              <button
                type="submit"
                class="btn btn-outline-warning"
                id="btnSubmit">
                {{ isEdit ? 'Update' : 'Save' }}
              </button>

              <button
                type="button"
                class="btn btn-outline-danger"
                (click)="cancel()">
                Cancel
              </button>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
