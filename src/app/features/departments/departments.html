
<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h3 class="page-title">
          Departments
          <button
            *ngIf="!showForm"
            type="button"
            class="btn btn-sm btn-primary"
            (click)="openCreateForm()">
            Add New
          </button>
        </h3>
      </div>

      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item">
            <a routerLink="/">Home</a>
          </li>
          <li class="breadcrumb-item active">Departments</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div class="row">

      <!-- Departments Table -->
      <div
        id="leftCard"
        [ngClass]="showForm
          ? 'col-lg-8 col-md-8 col-sm-12'
          : 'col-lg-12 col-md-12 col-sm-12'">

        <div class="card">
          <div class="table-responsive">
            <table class="table card-table table-vcenter text-nowrap">
              <thead>
                <tr>
                  <th class="w-1">No.</th>
                  <th>Department Name</th>
                  <th>Department Short Name</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>

              <tbody>
                <tr
                  *ngFor="let item of departments; let i = index"
                  class="align-middle">

                  <td>{{ i + 1 }}</td>
                  <td>{{ item.name }}</td>
                  <td>{{ item.shortName }}</td>

                  <td>
                    <span
                      class="status-icon"
                      [ngClass]="item.status ? 'bg-success' : 'bg-danger'">
                    </span>
                    {{ item.status ? 'Active' : 'Inactive' }}
                  </td>

                  <td>
                    <nav class="nav justify-content-center flex-nowrap">
                      <button
                        type="button"
                        class="nav-link badge shadow m-0 text-warning btn btnEdit"
                        (click)="openEditForm(item)">
                        <i class="fe fe-edit"></i>
                      </button>

                      <button
                        type="button"
                        class="nav-link badge shadow m-0 text-danger btn btn-delete"
                        (click)="openDeleteModal(item)">
                        <i class="fe fe-trash"></i>
                      </button>
                    </nav>
                  </td>
                </tr>

                <tr *ngIf="departments.length === 0">
                  <td colspan="5" class="text-center text-muted">
                    No departments available.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Add / Edit Department Form -->
      <div
        id="rightCard"
        class="col-lg-4 col-md-4 col-sm-12"
        *ngIf="showForm">

        <div class="card card-warning card-outline mb-4">
          <div class="text-danger px-3 pt-3" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="saveDepartment()">
            <input
              type="hidden"
              name="departmentId"
              [(ngModel)]="departmentId">

            <div class="card-body">
              <div class="mb-3">
                <label for="departmentName" class="col-form-label">
                  Department Name
                </label>

                <input
                  type="text"
                  id="departmentName"
                  name="departmentName"
                  class="form-control"
                  placeholder="Department Name"
                  [(ngModel)]="departmentName"
                  required>
              </div>

              <div class="mb-3">
                <label for="departmentShortName" class="col-form-label">
                  Department Short Name
                </label>

                <input
                  type="text"
                  id="departmentShortName"
                  name="departmentShortName"
                  class="form-control"
                  placeholder="Department Short Name"
                  [(ngModel)]="departmentShortName"
                  required>
              </div>

              <div class="form-check mt-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="status"
                  name="status"
                  [(ngModel)]="status">

                <label class="form-check-label" for="status">
                  Is Active
                </label>
              </div>
            </div>

            <div class="card-footer text-center">
              <button type="submit" class="btn btn-outline-secondary">
                {{ isEdit ? 'Update' : 'Save' }}
              </button>

              <button
                type="button"
                class="btn btn-outline-warning"
                (click)="closeForm()">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div
  class="department-modal-backdrop"
  *ngIf="showDeleteModal"
  (click)="closeDeleteModal()">

  <div
    class="department-modal"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()">

    <div class="modal-body text-center">
      <h2>
        <i class="bi bi-trash icon"></i>
        Are you sure want to delete ?
      </h2>

      <blockquote class="my-3 px-3">
        <p><strong>{{ deleteDisplay }}</strong></p>
      </blockquote>

      <button
        type="button"
        class="main-btn btn btn-warning cancel"
        (click)="closeDeleteModal()">
        No
      </button>

      <button
        type="button"
        class="main-btn btn btn-danger"
        (click)="confirmDelete()">
        Yes
      </button>
    </div>
  </div>
</div>
