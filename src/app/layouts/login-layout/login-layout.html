<div class="page login-layout">

  <div class="page-main">

    <!-- Header -->
    <header class="header py-4">
      <div class="container">
        <div class="d-flex align-items-center">

          <!-- Logo and Brand -->
          <a class="header-brand text-danger" routerLink="/">
            <img
              src="/images/logo.png"
              class="header-brand-img"
              alt="Om Sai Services"
            >
            Om Sai Services
          </a>

          <!-- Desktop Navigation -->
          <div class="desktop-navigation ml-auto">
            <a
              routerLink="/"
              class="nav-link pr-0 leading-none"
            >
              <span class="text-default">
                <i class="fe fe-home"></i>
                Home
              </span>
            </a>
          </div>

          <!-- Mobile Menu Toggle -->
          <button
            type="button"
            class="header-toggler d-lg-none ml-auto"
            aria-label="Toggle navigation"
            [attr.aria-expanded]="isMenuOpen"
            (click)="toggleMenu()"
          >
            <span class="header-toggler-icon"></span>
          </button>

        </div>
      </div>
    </header>

    <!-- Mobile Navigation -->
    <div
      class="login-mobile-menu d-lg-none"
      [class.show]="isMenuOpen"
    >
      <div class="container">
        <ul class="nav nav-tabs border-0 flex-column">

          <li class="nav-item">
            <a
              routerLink="/account/login"
              class="nav-link"
              (click)="closeMenu()"
            >
              <i class="fe fe-user"></i>
              Admin Login
            </a>
          </li>

          <li class="nav-item">
            <a
              href="/worker/WorkerAuthentication/Login"
              class="nav-link"
              (click)="closeMenu()"
            >
              <i class="fe fe-users"></i>
              Worker Login
            </a>
          </li>

        </ul>
      </div>
    </div>

    <!-- Login / Forgot Password Page Content -->
    <div class="container">
      <div class="my-3 my-md-5">
        <router-outlet></router-outlet>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="row align-items-center flex-row-reverse">

        <div class="col-auto ml-lg-auto">
          <div class="row align-items-center">
            <div class="col-auto">
              <ul class="list-inline list-inline-dots mb-0">
                <li class="list-inline-item">
                  <a routerLink="/">Terms And Privacy</a>
                </li>

                <li class="list-inline-item">
                  <a routerLink="/">FAQ</a>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-auto mt-3 mt-lg-0 text-center">
          Copyright © 2024
          <a routerLink="/">Om Sai Services</a>.
          Developed by
          <a href="/" target="_blank">Y-SAAS Infotech</a>
          All rights reserved.
        </div>

      </div>
    </div>
  </footer>

</div>
